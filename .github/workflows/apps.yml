# Builds PromptVault as an Android APK and a Windows .exe, and publishes both as a GitHub Release
# (from main, or when run by hand). The download links stay the same for every release:
#   https://github.com/<owner>/<repo>/releases/download/promptvault-latest/PromptVault.apk
#   https://github.com/<owner>/<repo>/releases/download/promptvault-latest/PromptVault.exe
name: PromptVault apps

on:
  push:
    branches: [main, 'ccr-**']
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'firebase-applet-config.json'
      - 'android/**'
      - 'desktop/**'
      - '.github/workflows/apps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the web app
        shell: bash
        env:
          VITE_STATIC: 'true'
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
      - name: Name the APK
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/PromptVault.apk
      - name: Check the APK carries the app and is signed
        run: |
          unzip -l out/PromptVault.apk | grep -q "assets/www/index.html"
          echo "files inside assets/www: $(unzip -l out/PromptVault.apk | grep -c 'assets/www/')"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs out/PromptVault.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: PromptVault-apk
          path: out/PromptVault.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the web app
        shell: bash
        env:
          VITE_STATIC: 'true'
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Build the .exe
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: PromptVault-exe
          path: desktop/dist/PromptVault.exe

  release:
    needs: [android, windows]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish the release (replaces the previous one, so the links never change)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "promptvault-latest" --repo "${{ github.repository }}" --cleanup-tag --yes || true
          sleep 5
          gh release create "promptvault-latest" files/* \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "PromptVault (build ${{ github.run_number }})" \
            --notes "Android: download the .apk, open it on the phone and allow installing from this source. Windows: download the .exe and run it (no installation). Windows may warn that the app is from an unknown publisher: choose More info, then Run anyway."
