# Publishes PromptVault to GitHub Pages: https://anandhavaradhan.github.io/Prompts/
#
# Pages for this repo is set to "Deploy from a branch" (main), which on its own would serve the
# source files, not the built app. So this runs right after each of those branch builds
# (the page_build event) and publishes the built app over it.
# Optional: set the repository variable API_BASE to the address of a hosted copy of server.ts
# to turn on Gemini naming and search. Without it the site uses on-device matching.
name: Website

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        env:
          VITE_STATIC: 'true'
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
